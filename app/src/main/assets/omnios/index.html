<!DOCTYPE html>
<html lang="en" data-theme="macos" data-mode="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>OmniOS - Server-Authoritative Remote UI</title>

  <!-- Typography & Stylesheets -->
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/core.css" />
  <link rel="stylesheet" href="css/apps.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/sdui-extra.css" />
</head>
<body class="theme-macos dark-mode">

  <!-- 1. Strict Disconnection Glass Barrier (Blocks interaction immediately upon disconnect) -->
  <div id="omnios-disconnect-barrier">
    <div class="barrier-card">
      <div class="barrier-spinner"></div>
      <div class="barrier-title">OmniOS Host Connection</div>
      <div class="barrier-desc" id="disconnect-status-text">Synchronizing with Android Host Server...</div>
      <div class="barrier-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span>Server-Authoritative SDUI Mode</span>
      </div>
    </div>
  </div>

  <!-- 2. Transparent Touch / Pointer Capture Plane -->
  <div id="omnios-touch-plane"></div>

  <!-- 3. Desktop Canvas & Wallpaper -->
  <div id="desktop" class="desktop-canvas">
    <!-- Desktop Shortcuts Grid -->
    <div id="desktop-icons" class="desktop-icons-grid"></div>

    <!-- Window Management Stage -->
    <div id="window-container" class="window-stage"></div>
  </div>

  <!-- 4. Global Topbar / Taskbar -->
  <header id="topbar" class="os-topbar glass-card">
    <div class="topbar-left flex items-center gap-3">
      <div class="os-logo" id="os-menu-trigger" title="OmniOS Host">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="active-app-name font-bold text-xs" id="active-app-title">OmniOS</span>
    </div>

    <div class="topbar-right flex items-center gap-3">
      <!-- Low-Latency RTT Badge -->
      <div id="rtt-status-badge">
        <span class="rtt-dot optimal"></span>
        <span>RTT: --</span>
      </div>

      <!-- Quick Panel Trigger -->
      <button class="topbar-icon-btn" id="quick-panel-trigger" title="Control Center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
      </button>

      <!-- Fullscreen Toggle (Hidden automatically on wireless displays and native app receivers) -->
      <button class="topbar-icon-btn fullscreen-toggle-btn" id="topbar-fullscreen-btn" title="Toggle Fullscreen">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>

      <!-- Notification Center Trigger -->
      <button class="topbar-icon-btn" id="notif-center-trigger" title="Notifications">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </button>

      <!-- System Clock -->
      <div class="topbar-clock font-semibold text-xs" id="topbar-clock">12:00</div>
    </div>
  </header>

  <!-- 5. Quick Panel Overlay -->
  <div id="quick-panel"></div>

  <!-- 6. Notification Center Overlay -->
  <div id="notification-center"></div>

  <!-- 7. Dynamic App Dock -->
  <nav id="dock" class="os-dock glass-card"></nav>

  <!-- Script Pipeline -->
  <script src="js/protocol.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/touch-controller.js"></script>
  <script src="js/sdui-client.js"></script>
</body>
</html>
